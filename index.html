<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TouchAI makes AI hardware-aware. Scan → Adapt → Route → Run → Remember. A deep relationship between models and their host machines." />
  <meta property="og:title" content="TouchAI — Hardware-aware AI" />
  <meta property="og:description" content="What it does: make AI know its host. How it works: Scan → Adapt → Route → Run → Remember." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='none' stroke='%230B8F8C' stroke-width='2'/><circle cx='16' cy='16' r='4' fill='%230B8F8C'/></svg>" />
  <title>TouchAI — Hardware-aware AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="boot" class="boot" aria-hidden="false">
    <div class="boot-inner">
      <div class="boot-logo"><span class="boot-ring"></span><span class="boot-dot"></span></div>
      <div class="boot-title">TouchAI</div>
      <div class="boot-sub">Scan · Adapt · Route · Run · Remember</div>
      <div id="bootLog" class="boot-log" role="log" aria-live="polite"></div>
      <div class="boot-bar"><div id="bootProgress" class="boot-bar-fill"></div></div>
    </div>
  </div>

  <div id="cursor" class="cursor" aria-hidden="true">
    <div class="cursor-ring"></div>
    <div class="cursor-dot"></div>
  </div>
  <div id="rippleLayer" class="ripple-layer" aria-hidden="true"></div>

  <div id="app" class="app hidden">
    <header class="site-header">
      <button class="header-left interactive" data-nav="home" type="button" aria-label="TouchAI home">
        <div class="logo-mark"><span class="logo-ring"></span><span class="logo-dot"></span></div>
        <div>
          <span class="logo-text">TouchAI</span>
          <span class="logo-tagline">Hardware-aware AI</span>
        </div>
      </button>

      <nav class="site-nav" aria-label="Main">
        <button class="nav-link interactive active" data-view="home">What & How</button>
        <button class="nav-link interactive" data-view="try">Try</button>
        <button class="nav-link interactive" data-view="sdk">SDK</button>
      </nav>

      <div class="header-right">
        <span class="header-stat" id="navSituation">Host…</span>
        <span class="runtime-badge" id="runtimeBadge">—</span>
      </div>
    </header>

    <div class="status-strip" id="statusStrip">
      <span class="status-strip-label" id="statusStripLabel">What · How · TouchAI</span>
      <span class="focus-sep">·</span>
      <span id="statusStripDetail">hardware-aware AI</span>
    </div>

    <div class="view-container">
      <div id="viewHome" class="view"></div>
      <div id="viewSdk" class="view hidden"></div>
      <div id="viewTry" class="view hidden">
        <header class="demo-topbar">
          <div class="demo-topbar-left">
            <span class="mvp-pill compact">How it works · live</span>
            <h1 id="demoTitle">Situated Agent</h1>
            <span class="topbar-badge" id="modelBadge">Pulse</span>
            <span class="topbar-badge device-badge" id="deviceBadge">local</span>
          </div>
          <div class="stats-bar">
            <div class="stat"><span class="stat-label">Last</span><span class="stat-val" id="statLast">—</span></div>
            <div class="stat"><span class="stat-label">Avg</span><span class="stat-val" id="statAvg">—</span></div>
            <div class="stat"><span class="stat-label">Queries</span><span class="stat-val" id="statQueries">0</span></div>
            <div class="stat"><span class="stat-label">Tokens</span><span class="stat-val" id="statTokens">0</span></div>
          </div>
        </header>
        <div class="pipeline-strip" aria-label="How TouchAI works">
          <span>Scan</span><span class="pipeline-arrow">→</span>
          <span>Adapt</span><span class="pipeline-arrow">→</span>
          <span>Route</span><span class="pipeline-arrow">→</span>
          <span>Run</span><span class="pipeline-arrow">→</span>
          <span>Remember</span>
        </div>
        <div id="demoRoot" class="demo-root"></div>
      </div>
    </div>

    <footer class="site-footer">
      <div class="status-dot online"></div>
      <span id="statusText">TouchAI · starting</span>
      <span class="footer-sep">·</span>
      <span>Hardware-aware AI</span>
    </footer>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
